steps:
  - number: 1
    name: "Extraction and re-engineering"
    script: "01_extraction_reengineering/extract_fastf1_sources.py"
    enabled: true

  - number: 2
    name: "Load reconciled PostgreSQL database"
    script: "02_load_reconciled_db/load_reconciled_tables.py"
    enabled: true

  - number: 3
    name: "General data quality assessment"
    script: "03_data_quality/01_dqa/01_dqa.py"
    enabled: true

  - number: 4
    name: "Focused missing values analysis"
    script: "03_data_quality/02_missing_values/missing_values_analysis.py"
    enabled: true

  - number: 5
    name: "Focused lap outlier detection"
    script: "03_data_quality/03_outlier_detection/lap_outlier_detection.py"
    enabled: true

  - number: 6
    name: "Generate complete data quality visualizations"
    script: "03_data_quality/04_visualizations/data_quality_plots.py"
    enabled: true

  - number: 7
    name: "LLM interpretation of complete data quality results"
    script: "03_data_quality/05_llm/llm_data_quality_interpretation.py"
    enabled: true

  - number: 8
    name: "Data cleaning"
    script: "04_data_cleaning/data_cleaning.py"
    enabled: true

  - number: 9
    name: "Apply reconciled database constraints"
    script: "05_apply_reconciled_constraints/apply_reconciled_constraints.py"
    enabled: true

  - number: 10
    name: "Transform reconciled clean data to data warehouse"
    script: "06_etl/transform_reconciled_to_dw.py"
    enabled: true
